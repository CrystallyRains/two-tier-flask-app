# Goal: Build the Docker Image in CI

on: 
  push:
    branches: [master]

jobs:
  docker_push:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: "${{ secrets.DOCKER_USERNAME }}/two-tier-flask-app:latest"
